# fly.toml — SmartAttendance backend deployment
# Fly.io Free Tier: 256 MB RAM, 1 shared CPU, 3 GB storage
app = "smartattendance-api"

[build]
  dockerfile = "fly.Dockerfile"

[env]
  APP_NAME = "SmartAttendance API"
  APP_VERSION = "1.0.0"
  ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "1440"
  REFRESH_TOKEN_EXPIRE_DAYS = "30"
  TIMEZONE = "America/Bogota"
  HORA_ENTRADA_LIMITE = "08:30"
  ALLOWED_ORIGINS = '["*"]'

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[mounts]
  source = "smartattendance_data"
  destination = "/data"
