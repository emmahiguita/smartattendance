# Render.com Blueprint — despliegue del backend SmartAttendance
# ======================================================================
# Web Service (Free): 512 MB RAM, se duerme tras 15 min inactivo.
# PostgreSQL (Free):    1 GB storage, expira en 90 días (renovable).
#
# La app Flutter despierta el backend al hacer health check al abrir.
#
# Desplegar:
#   1. Conecta este repo en dashboard.render.com
#   2. Render detecta este render.yaml automáticamente
#   3. Las env vars con sync:false se configuran manualmente en el dashboard
# ======================================================================

databases:
  - name: smartattendance-db
    plan: free
    region: ohio
    databaseName: smartattendance
    user: smartattendance_user

services:
  - type: web
    name: smartattendance-api
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn main:create_app --factory --host 0.0.0.0 --port $PORT
    rootDir: smartattendance_backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartattendance-db
          property: connectionString
      - key: APP_NAME
        value: SmartAttendance API
      - key: APP_VERSION
        value: 1.0.0
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: ALGORITHM
        value: HS256
      - key: TIMEZONE
        value: America/Bogota
      - key: HORA_ENTRADA_LIMITE
        value: "08:30"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      # Configurar manualmente en el dashboard de Render:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    healthCheckPath: /health
    autoDeploy: true
