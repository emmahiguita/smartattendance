name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: smartattendance_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Google OAuth for iOS
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          printf 'GOOGLE_IOS_CLIENT_ID=%s\nGOOGLE_SERVER_CLIENT_ID=%s\nGOOGLE_IOS_REVERSED_CLIENT_ID=%s\nIOS_TEAM_ID=%s\n' \
            "${GOOGLE_IOS_CLIENT_ID:-com.smartattendance.ios}" \
            "${GOOGLE_SERVER_CLIENT_ID:-com.smartattendance.server}" \
            "${GOOGLE_IOS_REVERSED_CLIENT_ID:-com.smartattendance.ios}" \
            "${IOS_TEAM_ID:-}" \
            > ios/Flutter/GoogleOAuth.xcconfig

      - name: Build Signed iOS Archive and IPA (When Apple Signing Secrets Exist)
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "${IOS_KEYCHAIN_PASSWORD:-temp_pass}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD:-temp_pass}" build.keychain
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "${IOS_KEYCHAIN_PASSWORD:-temp_pass}" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          sed "s/TEAM_ID_PLACEHOLDER/$IOS_TEAM_ID/g" ios/ExportOptions.plist.example > "$RUNNER_TEMP/ExportOptions.plist"
          flutter build ipa --release \
            --dart-define=APP_ENV=production \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Build Unsigned iOS IPA (Fallback When Signing Secrets Are Omitted)
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 == '' || secrets.IOS_PROVISIONING_PROFILE_BASE64 == '' || secrets.IOS_TEAM_ID == '' }}
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r SmartAttendance_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance_iOS_Package
          path: smartattendance_app/build/ios/ipa/*.ipa
          retention-days: 14
